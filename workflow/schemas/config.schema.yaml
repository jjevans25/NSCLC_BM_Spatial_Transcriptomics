$schema: "https://json-schema.org/draft/2020-12/schema"
description: >
  Configuration for the nsclc-brainmet-time workflow. Enforced via
  snakemake.utils.validate() at Snakefile load time, so a hand-edit that
  breaks the contract fails at parse rather than three rules later.
type: object
required: [project, paths, samples, seed, qc, normalisation, phases, acquire, landscape, contexture, checkpoints, reference]
additionalProperties: false
properties:
  project:
    type: object
    required: [code, geo_accession, source_pmid]
    properties:
      code: {type: string}
      geo_accession: {type: string, pattern: "^GSE[0-9]+$"}
      source_pmid: {type: string, pattern: "^[0-9]+$"}
  paths:
    type: object
    required: [resources, raw, reference, interim, tables, figures, logs, benchmarks, reports]
    additionalProperties: {type: string}
  samples:
    type: object
    required: [tsv, compartment_map, expected_n_aoi]
    properties:
      tsv: {type: string}
      compartment_map: {type: string}
      expected_n_aoi: {type: integer, minimum: 1}
  seed:
    type: integer
    description: Single source of randomness for every stochastic step.
  qc:
    type: object
    required: [min_gene_detection_rate, min_library_size, min_sequencing_saturation, detection_background_multiple, flag_only]
    properties:
      min_gene_detection_rate:
        type: [number, "null"]
        minimum: 0
        maximum: 1
        description: null until the P0-T5 gate chooses it and an ADR records why.
      min_library_size:
        type: [number, "null"]
        minimum: 0
        description: >
          Raw sequencing reads from the DCC header, NOT the sum of the
          Q3-normalised matrix — that sum is post-normalisation and near
          constant by construction, so it measures nothing.
      min_sequencing_saturation:
        type: [number, "null"]
        minimum: 0
        maximum: 1
        description: null until P0-T5 chooses it. The source paper claims no ROI below 0.50.
      detection_background_multiple:
        type: [number, "null"]
        minimum: 0
        description: >
          A gene counts as detected in an AOI when its value exceeds this
          multiple of that AOI's NegProbe-WTX level. The matrix has no zeros
          (Q1), so detection must be background-relative. null until chosen.
      flag_only:
        type: boolean
        description: AOIs are flagged with a reason, never silently dropped.
  normalisation:
    type: object
    required: [method, log_base, pseudocount]
    properties:
      method: {type: string, enum: [q3, none, verify]}
      log_base: {type: number}
      pseudocount: {type: number, minimum: 0}
  phases:
    type: object
    additionalProperties: {type: boolean}
  landscape:
    type: object
    description: Phase 1 (A2) — feature selection and ordination parameters.
    required: [n_top_genes, hvg_flavour, n_pcs]
    additionalProperties: false
    properties:
      n_top_genes:
        type: integer
        minimum: 100
        description: Highly variable genes retained before PCA (PROJECT_PLAN §6, "~2000").
      hvg_flavour:
        type: string
        enum: [seurat, cell_ranger, seurat_v3]
        description: scanpy highly_variable_genes flavour. seurat expects log data, which X is.
      n_pcs:
        type: integer
        minimum: 2
        description: Principal components computed and retained.
      variance:
        type: object
        description: >
          P1-T3 variance partition (Gate 1). The factors are entered as crossed
          random effects, so a factor's share is penalised by its level count —
          which a naive eta-squared is not, and patient_id has 42 levels across
          120 AOIs.
        required: [factors, pvca_min_variance, n_permutations, n_permutation_genes]
        additionalProperties: false
        properties:
          factors:
            type: array
            minItems: 1
            items: {type: string}
            description: obs columns entered as variance components, in report order.
          pvca_min_variance:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            description: >
              Cumulative eigenvalue fraction of the sample correlation matrix that
              PVCA retains. 0.60 is Bushel's default; ADR 0009 (P1-T6) records it.
          n_permutations:
            type: integer
            minimum: 0
            description: Label shuffles used for the empirical null baseline. 0 disables it.
          n_permutation_genes:
            type: integer
            minimum: 1
            description: Genes sampled per permutation, seeded from config.seed.
      clustering:
        type: object
        description: >
          P1-T4 hierarchical clustering of AOIs. The plan expects patients to
          cluster together across compartments; the agreement statistics here
          exist to test that rather than illustrate it.
        required: [metric, linkage, k_range, n_permutations]
        additionalProperties: false
        properties:
          metric:
            type: string
            enum: [spearman, pearson]
            description: AOI-AOI correlation metric; distance is 1 - rho.
          linkage:
            type: string
            enum: [average, complete, single, weighted]
            description: >
              scipy linkage method. Euclidean-only methods (ward, centroid,
              median) are excluded because the distance is 1 - rho.
          k_range:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: integer, minimum: 2}
            description: Inclusive [min, max] cluster counts swept for agreement.
          n_permutations:
            type: integer
            minimum: 0
            description: Label shuffles behind the ARI null. 0 disables it.
  contexture:
    type: object
    description: >
      Phase 2 (A1/A3) — the lung-vs-brain immune contrast within the TIME
      compartment. Scored on 23 AOIs (TIME-L 15 + TIME-B 8), so every threshold
      here is operating at the design's binding constraint: TIME-B n = 8, with
      a power floor of ~1.1-1.3 SD at 80% (P0-T8).
    required: [signatures_yaml, aoi_codes, scoring, model, deconvolution]
    additionalProperties: false
    properties:
      signatures_yaml:
        type: string
        description: >
          Path to the versioned gene sets, validated against
          signatures.schema.yaml at Snakefile load. A separate file from this
          one on purpose: config.yaml is a declared input of
          p0t7_assemble_h5ad, so editing it rebuilds the .h5ad and re-runs
          every downstream rule including P1-T3's ~25-minute fit. A signature
          edit has no business triggering that.
      aoi_codes:
        type: array
        minItems: 1
        items: {type: string}
        description: >
          The compartments scored. Estimating across compartments rather than
          within is what ADR 0009 forbids, so this list is the mechanism that
          keeps L/LB out of the contrast.
      scoring:
        type: object
        required: [methods, min_set_size, detected_in_aoi_fraction, min_detected_fraction]
        additionalProperties: false
        properties:
          methods:
            type: array
            minItems: 2
            items: {type: string, enum: [ssgsea, zscore]}
            description: >
              Both, always. Agreement between two methods is the robustness
              evidence at this n; a single method has nothing to agree with.
          min_set_size:
            type: integer
            minimum: 2
            description: >
              Passed explicitly to gseapy.ssgsea, whose own default is 15 —
              larger than every set in this project. On gseapy 1.3.1 the
              default raises LookupError rather than returning nothing, so the
              failure is loud; the value still has to be set for the rule to
              run.
          detected_in_aoi_fraction:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            description: Fraction of a site's AOIs in which a gene must clear background.
          min_detected_fraction:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            description: >
              Fraction of a set's genes that must be present at a site for the
              set to be "assessable" there. Below it, ADR 0008's language rule
              applies: "not assessable in brain", never "lower in brain".
      model:
        type: object
        required: [primary, sensitivity, df_method, fdr_method, fdr_alpha, crosscheck_signature]
        additionalProperties: false
        properties:
          primary:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: >
              The pattern is load-bearing, not decoration: ADR 0009 makes
              (1|patient_id) mandatory in every downstream model, justified on
              non-independence rather than variance share, and changing the
              random-effects structure is a "stop and ask". A config edit that
              drops it now fails at parse.
          sensitivity:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: The batch-adjusted refit. ADR 0012.
          df_method: {type: string, enum: [satterthwaite, kenward-roger]}
          fdr_method: {type: string, enum: [fdr_bh]}
          fdr_alpha: {type: number, exclusiveMinimum: 0, maximum: 1}
          crosscheck_signature:
            type: string
            description: Signature refit in statsmodels.MixedLM as an implementation cross-check.
      deconvolution:
        type: object
        required: [primary_reference, sensitivity_references, renormalise_within]
        additionalProperties: false
        properties:
          primary_reference:
            type: string
            description: >
              Applied to every aoi_code, which is what makes its composition
              comparable across sites. safeTME ships inside SpatialDecon.
          sensitivity_references:
            type: object
            additionalProperties: {type: string}
            description: >
              PROJECT_PLAN §6's two-matrix approach, one reference per
              compartment. Cross-site comparison of THIS arm is
              reference-confounded and the written caveat is part of the
              deliverable, not a footnote.
          renormalise_within:
            type: string
            enum: [compartment]
  checkpoints:
    type: object
    description: >
      Phase 3 (A4) — the checkpoint landscape by compartment, EXPLORATORY per
      ADR 0008. Every threshold here was pre-registered in ADR 0016 and
      committed before any Phase 3 result was computed; a floor chosen after
      seeing which genes clear it is the failure P3-T2 exists to prevent.
    required: [panel_yaml, audit_aoi_codes, model_aoi_codes, detection, model]
    additionalProperties: false
    properties:
      panel_yaml:
        type: string
        description: >
          Path to the pre-registered checkpoint panel, validated against
          checkpoints.schema.yaml at Snakefile load. A separate file from this
          one for the same reason signatures.yaml is: config.yaml is a declared
          input of p0t7_assemble_h5ad, so editing it rebuilds the .h5ad and
          re-runs Phase 1 and Phase 2. A panel edit has no business costing
          that.
      audit_aoi_codes:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string}
        description: >
          Compartments entering the P3-T2 detection audit. Broader than
          model_aoi_codes on purpose — the audit IS the phase's deliverable
          (Gate 3), so it covers compartments no model can touch.
      model_aoi_codes:
        type: array
        minItems: 2
        uniqueItems: true
        items: {type: string}
        description: >
          Compartments entering the P3-T3/T4 models. Restricted to those
          spanning both DSP runs, so no contrast confounds batch with biology;
          TBME, mLN and BC sit wholly inside one run (Q3) and ADR 0009 §3 says
          no covariate recovers that. This list is the mechanism that keeps
          them out — and, like contexture.aoi_codes, what stops estimation
          drifting across compartments rather than within.
      detection:
        type: object
        required: [detected_in_aoi_fraction, min_assessable_fraction]
        additionalProperties: false
        properties:
          detected_in_aoi_fraction:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            description: >
              Fraction of a compartment's AOIs in which a gene must clear
              qc.detection_background_multiple x that AOI's NegProbe-WTX level
              to count as present there. ADR 0008 point 4 in numeric form.
          min_assessable_fraction:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            description: >
              Fraction of the panel that must be present for the panel to be
              "assessable" in a compartment. Below it the statement is "not
              assessable in <compartment>", never "lower in <compartment>".
      model:
        type: object
        required: [carrier, carrier_batch_sensitivity, carrier_background_sensitivity,
                   shift, shift_batch_sensitivity, shift_background_sensitivity,
                   df_method, fdr_method, fdr_alpha, crosscheck_gene]
        additionalProperties: false
        properties:
          carrier:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: >
              P3-T3, within site: which compartment carries each checkpoint.
              The pattern is load-bearing, not decoration — ADR 0009 makes
              (1|patient_id) mandatory on non-independence grounds and changing
              the random-effects structure is a "stop and ask". A config edit
              that drops it fails at parse. Singular fits are NOT grounds to
              drop it; half of Phase 2's fits were singular and it stayed.
          carrier_batch_sensitivity:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: The dsp_run-adjusted carrier refit. ADR 0012's shape.
          carrier_background_sensitivity:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: >
              The negprobe-adjusted carrier refit. ADR 0008 point 5 mandates
              this only for brain-vs-lung, but the L-to-TIME-L background gap
              (log2 4.96 -> 5.36) is larger than the TIME-L-to-TIME-B gap
              (5.36 -> 5.30), so the compartment contrast is at least as
              exposed. ADR 0016 records the extension.
          shift:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: >
              P3-T4, within compartment: does the profile shift lung -> brain.
              Never pooled across compartments (ADR 0009 §Consequences).
          shift_batch_sensitivity:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: The dsp_run-adjusted shift refit. ADR 0012.
          shift_background_sensitivity:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: >
              The negprobe-adjusted shift refit — the second of the two routes
              ADR 0008 point 5 offers, run alongside the restriction rather
              than instead of it.
          df_method: {type: string, enum: [satterthwaite, kenward-roger]}
          fdr_method: {type: string, enum: [fdr_bh]}
          fdr_alpha: {type: number, exclusiveMinimum: 0, maximum: 1}
          crosscheck_gene:
            type: string
            description: >
              Gene refit in statsmodels.MixedLM as an implementation
              cross-check. Estimates and SEs are compared; df and p are not,
              because lmerTest uses Satterthwaite and statsmodels a Wald z.
  reference:
    type: object
    description: >
      P2-T5 reference matrices, fetched into paths.reference. Same ADR 0005
      contract as `acquire`: pinned digests, protected() outputs, resources/
      read-only afterwards.
    required: [base_url, artifacts]
    additionalProperties: false
    properties:
      base_url:
        type: string
        pattern: "/[0-9a-f]{40}$"
        description: >
          Must end in a 40-character commit SHA. CellProfileLibrary is a live
          GitHub repo, so a branch ref would let the reference matrix change
          under a rerun and turn the sha256 pins below into failures rather
          than controls.
      artifacts:
        type: object
        minProperties: 1
        additionalProperties:
          type: object
          required: [remote, dest, stability, sha256]
          additionalProperties: false
          properties:
            remote: {type: string}
            dest: {type: string}
            stability: {type: string, enum: [fixed, volatile]}
            sha256: {type: [string, "null"], pattern: "^[0-9a-f]{64}$"}
  acquire:
    type: object
    description: >
      P0-T2 source manifest. Every artifact is fetched from base_url/remote into
      paths.raw/dest. `stability` is the checksum tier and it is load-bearing:
      author-uploaded supplementary files are `fixed` and a SHA-256 mismatch is a
      hard failure, while GEO-generated metadata (SOFT, series matrix) is
      `volatile` — regenerated server-side, so its digest is recorded as an
      observation rather than enforced. See ADR 0005.
    required: [base_url, artifacts]
    additionalProperties: false
    properties:
      base_url: {type: string}
      artifacts:
        type: object
        minProperties: 1
        additionalProperties:
          type: object
          required: [remote, dest, stability, sha256]
          additionalProperties: false
          properties:
            remote: {type: string, description: path below base_url}
            dest: {type: string, description: filename under paths.raw}
            stability:
              type: string
              enum: [fixed, volatile]
            sha256:
              type: [string, "null"]
              pattern: "^[0-9a-f]{64}$"
              description: >
                null until the first run computes it. A `fixed` artifact left
                null is an unenforced provenance control that looks enforced —
                pin it before committing. Same reasoning as
                qc.min_gene_detection_rate.
