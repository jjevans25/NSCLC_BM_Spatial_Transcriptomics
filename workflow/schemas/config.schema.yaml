$schema: "https://json-schema.org/draft/2020-12/schema"
description: >
  Configuration for the nsclc-brainmet-time workflow. Enforced via
  snakemake.utils.validate() at Snakefile load time, so a hand-edit that
  breaks the contract fails at parse rather than three rules later.
type: object
required: [project, paths, samples, seed, qc, normalisation, phases, acquire, landscape,
           contexture, checkpoints, crosstalk, survival, fair, reference]
additionalProperties: false
properties:
  project:
    type: object
    required: [code, geo_accession, source_pmid]
    properties:
      code: {type: string}
      geo_accession: {type: string, pattern: "^GSE[0-9]+$"}
      source_pmid: {type: string, pattern: "^[0-9]+$"}
  paths:
    type: object
    required: [resources, raw, reference, interim, tables, figures, logs, benchmarks, reports]
    additionalProperties: {type: string}
  samples:
    type: object
    required: [tsv, compartment_map, expected_n_aoi]
    properties:
      tsv: {type: string}
      compartment_map: {type: string}
      expected_n_aoi: {type: integer, minimum: 1}
  seed:
    type: integer
    description: Single source of randomness for every stochastic step.
  qc:
    type: object
    required: [min_gene_detection_rate, min_library_size, min_sequencing_saturation, detection_background_multiple, flag_only]
    properties:
      min_gene_detection_rate:
        type: [number, "null"]
        minimum: 0
        maximum: 1
        description: null until the P0-T5 gate chooses it and an ADR records why.
      min_library_size:
        type: [number, "null"]
        minimum: 0
        description: >
          Raw sequencing reads from the DCC header, NOT the sum of the
          Q3-normalised matrix — that sum is post-normalisation and near
          constant by construction, so it measures nothing.
      min_sequencing_saturation:
        type: [number, "null"]
        minimum: 0
        maximum: 1
        description: null until P0-T5 chooses it. The source paper claims no ROI below 0.50.
      detection_background_multiple:
        type: [number, "null"]
        minimum: 0
        description: >
          A gene counts as detected in an AOI when its value exceeds this
          multiple of that AOI's NegProbe-WTX level. The matrix has no zeros
          (Q1), so detection must be background-relative. null until chosen.
      flag_only:
        type: boolean
        description: AOIs are flagged with a reason, never silently dropped.
  normalisation:
    type: object
    required: [method, log_base, pseudocount]
    properties:
      method: {type: string, enum: [q3, none, verify]}
      log_base: {type: number}
      pseudocount: {type: number, minimum: 0}
  phases:
    type: object
    additionalProperties: {type: boolean}
  landscape:
    type: object
    description: Phase 1 (A2) — feature selection and ordination parameters.
    required: [n_top_genes, hvg_flavour, n_pcs]
    additionalProperties: false
    properties:
      n_top_genes:
        type: integer
        minimum: 100
        description: Highly variable genes retained before PCA (PROJECT_PLAN §6, "~2000").
      hvg_flavour:
        type: string
        enum: [seurat, cell_ranger, seurat_v3]
        description: scanpy highly_variable_genes flavour. seurat expects log data, which X is.
      n_pcs:
        type: integer
        minimum: 2
        description: Principal components computed and retained.
      variance:
        type: object
        description: >
          P1-T3 variance partition (Gate 1). The factors are entered as crossed
          random effects, so a factor's share is penalised by its level count —
          which a naive eta-squared is not, and patient_id has 42 levels across
          120 AOIs.
        required: [factors, pvca_min_variance, n_permutations, n_permutation_genes]
        additionalProperties: false
        properties:
          factors:
            type: array
            minItems: 1
            items: {type: string}
            description: obs columns entered as variance components, in report order.
          pvca_min_variance:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            description: >
              Cumulative eigenvalue fraction of the sample correlation matrix that
              PVCA retains. 0.60 is Bushel's default; ADR 0009 (P1-T6) records it.
          n_permutations:
            type: integer
            minimum: 0
            description: Label shuffles used for the empirical null baseline. 0 disables it.
          n_permutation_genes:
            type: integer
            minimum: 1
            description: Genes sampled per permutation, seeded from config.seed.
      clustering:
        type: object
        description: >
          P1-T4 hierarchical clustering of AOIs. The plan expects patients to
          cluster together across compartments; the agreement statistics here
          exist to test that rather than illustrate it.
        required: [metric, linkage, k_range, n_permutations]
        additionalProperties: false
        properties:
          metric:
            type: string
            enum: [spearman, pearson]
            description: AOI-AOI correlation metric; distance is 1 - rho.
          linkage:
            type: string
            enum: [average, complete, single, weighted]
            description: >
              scipy linkage method. Euclidean-only methods (ward, centroid,
              median) are excluded because the distance is 1 - rho.
          k_range:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: integer, minimum: 2}
            description: Inclusive [min, max] cluster counts swept for agreement.
          n_permutations:
            type: integer
            minimum: 0
            description: Label shuffles behind the ARI null. 0 disables it.
  contexture:
    type: object
    description: >
      Phase 2 (A1/A3) — the lung-vs-brain immune contrast within the TIME
      compartment. Scored on 23 AOIs (TIME-L 15 + TIME-B 8), so every threshold
      here is operating at the design's binding constraint: TIME-B n = 8, with
      a power floor of ~1.1-1.3 SD at 80% (P0-T8).
    required: [signatures_yaml, aoi_codes, scoring, model, deconvolution]
    additionalProperties: false
    properties:
      signatures_yaml:
        type: string
        description: >
          Path to the versioned gene sets, validated against
          signatures.schema.yaml at Snakefile load. A separate file from this
          one on purpose: config.yaml is a declared input of
          p0t7_assemble_h5ad, so editing it rebuilds the .h5ad and re-runs
          every downstream rule including P1-T3's ~25-minute fit. A signature
          edit has no business triggering that.
      aoi_codes:
        type: array
        minItems: 1
        items: {type: string}
        description: >
          The compartments scored. Estimating across compartments rather than
          within is what ADR 0009 forbids, so this list is the mechanism that
          keeps L/LB out of the contrast.
      scoring:
        type: object
        required: [methods, min_set_size, detected_in_aoi_fraction, min_detected_fraction]
        additionalProperties: false
        properties:
          methods:
            type: array
            minItems: 2
            items: {type: string, enum: [ssgsea, zscore]}
            description: >
              Both, always. Agreement between two methods is the robustness
              evidence at this n; a single method has nothing to agree with.
          min_set_size:
            type: integer
            minimum: 2
            description: >
              Passed explicitly to gseapy.ssgsea, whose own default is 15 —
              larger than every set in this project. On gseapy 1.3.1 the
              default raises LookupError rather than returning nothing, so the
              failure is loud; the value still has to be set for the rule to
              run.
          detected_in_aoi_fraction:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            description: Fraction of a site's AOIs in which a gene must clear background.
          min_detected_fraction:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            description: >
              Fraction of a set's genes that must be present at a site for the
              set to be "assessable" there. Below it, ADR 0008's language rule
              applies: "not assessable in brain", never "lower in brain".
      model:
        type: object
        required: [primary, sensitivity, df_method, fdr_method, fdr_alpha, crosscheck_signature]
        additionalProperties: false
        properties:
          primary:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: >
              The pattern is load-bearing, not decoration: ADR 0009 makes
              (1|patient_id) mandatory in every downstream model, justified on
              non-independence rather than variance share, and changing the
              random-effects structure is a "stop and ask". A config edit that
              drops it now fails at parse.
          sensitivity:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: The batch-adjusted refit. ADR 0012.
          df_method: {type: string, enum: [satterthwaite, kenward-roger]}
          fdr_method: {type: string, enum: [fdr_bh]}
          fdr_alpha: {type: number, exclusiveMinimum: 0, maximum: 1}
          crosscheck_signature:
            type: string
            description: Signature refit in statsmodels.MixedLM as an implementation cross-check.
      deconvolution:
        type: object
        required: [primary_reference, sensitivity_references, renormalise_within]
        additionalProperties: false
        properties:
          primary_reference:
            type: string
            description: >
              Applied to every aoi_code, which is what makes its composition
              comparable across sites. safeTME ships inside SpatialDecon.
          sensitivity_references:
            type: object
            additionalProperties: {type: string}
            description: >
              PROJECT_PLAN §6's two-matrix approach, one reference per
              compartment. Cross-site comparison of THIS arm is
              reference-confounded and the written caveat is part of the
              deliverable, not a footnote.
          renormalise_within:
            type: string
            enum: [compartment]
  checkpoints:
    type: object
    description: >
      Phase 3 (A4) — the checkpoint landscape by compartment, EXPLORATORY per
      ADR 0008. Every threshold here was pre-registered in ADR 0016 and
      committed before any Phase 3 result was computed; a floor chosen after
      seeing which genes clear it is the failure P3-T2 exists to prevent.
    required: [panel_yaml, audit_aoi_codes, model_aoi_codes, detection, model]
    additionalProperties: false
    properties:
      panel_yaml:
        type: string
        description: >
          Path to the pre-registered checkpoint panel, validated against
          checkpoints.schema.yaml at Snakefile load. A separate file from this
          one for the same reason signatures.yaml is: config.yaml is a declared
          input of p0t7_assemble_h5ad, so editing it rebuilds the .h5ad and
          re-runs Phase 1 and Phase 2. A panel edit has no business costing
          that.
      audit_aoi_codes:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string}
        description: >
          Compartments entering the P3-T2 detection audit. Broader than
          model_aoi_codes on purpose — the audit IS the phase's deliverable
          (Gate 3), so it covers compartments no model can touch.
      model_aoi_codes:
        type: array
        minItems: 2
        uniqueItems: true
        items: {type: string}
        description: >
          Compartments entering the P3-T3/T4 models. Restricted to those
          spanning both DSP runs, so no contrast confounds batch with biology;
          TBME, mLN and BC sit wholly inside one run (Q3) and ADR 0009 §3 says
          no covariate recovers that. This list is the mechanism that keeps
          them out — and, like contexture.aoi_codes, what stops estimation
          drifting across compartments rather than within.
      detection:
        type: object
        required: [detected_in_aoi_fraction, min_assessable_fraction]
        additionalProperties: false
        properties:
          detected_in_aoi_fraction:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            description: >
              Fraction of a compartment's AOIs in which a gene must clear
              qc.detection_background_multiple x that AOI's NegProbe-WTX level
              to count as present there. ADR 0008 point 4 in numeric form.
          min_assessable_fraction:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            description: >
              Fraction of the panel that must be present for the panel to be
              "assessable" in a compartment. Below it the statement is "not
              assessable in <compartment>", never "lower in <compartment>".
      model:
        type: object
        required: [carrier, carrier_batch_sensitivity, carrier_background_sensitivity,
                   shift, shift_batch_sensitivity, shift_background_sensitivity,
                   df_method, fdr_method, fdr_alpha, crosscheck_gene]
        additionalProperties: false
        properties:
          carrier:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: >
              P3-T3, within site: which compartment carries each checkpoint.
              The pattern is load-bearing, not decoration — ADR 0009 makes
              (1|patient_id) mandatory on non-independence grounds and changing
              the random-effects structure is a "stop and ask". A config edit
              that drops it fails at parse. Singular fits are NOT grounds to
              drop it; half of Phase 2's fits were singular and it stayed.
          carrier_batch_sensitivity:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: The dsp_run-adjusted carrier refit. ADR 0012's shape.
          carrier_background_sensitivity:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: >
              The negprobe-adjusted carrier refit. ADR 0008 point 5 mandates
              this only for brain-vs-lung, but the L-to-TIME-L background gap
              (log2 4.96 -> 5.36) is larger than the TIME-L-to-TIME-B gap
              (5.36 -> 5.30), so the compartment contrast is at least as
              exposed. ADR 0016 records the extension.
          shift:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: >
              P3-T4, within compartment: does the profile shift lung -> brain.
              Never pooled across compartments (ADR 0009 §Consequences).
          shift_batch_sensitivity:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: The dsp_run-adjusted shift refit. ADR 0012.
          shift_background_sensitivity:
            type: string
            pattern: "\\(1\\|patient_id\\)"
            description: >
              The negprobe-adjusted shift refit — the second of the two routes
              ADR 0008 point 5 offers, run alongside the restriction rather
              than instead of it.
          df_method: {type: string, enum: [satterthwaite, kenward-roger]}
          fdr_method: {type: string, enum: [fdr_bh]}
          fdr_alpha: {type: number, exclusiveMinimum: 0, maximum: 1}
          crosscheck_gene:
            type: string
            description: >
              Gene refit in statsmodels.MixedLM as an implementation
              cross-check. Estimates and SEs are compared; df and p are not,
              because lmerTest uses Satterthwaite and statsmodels a Wald z.
  crosstalk:
    type: object
    description: >
      Phase 4 (A5) — inferred crosstalk between adjacent compartments,
      EXPLORATORY per ADR 0014. Every threshold here was pre-registered in
      ADR 0021 and committed before any Phase 4 result was computed; a ranked
      correlation is the easiest quantity in this project to manufacture by
      choosing a threshold late, which is why P4-T1's own acceptance criterion
      is "ADR committed before running anything".
    required: [lr_yaml, adjacencies, pairing, detection, correlation, null_calibration]
    additionalProperties: false
    properties:
      lr_yaml:
        type: string
        description: >
          Path to the pinned ligand–receptor database manifest, validated
          against ligand_receptor.schema.yaml at Snakefile load. A separate file
          for the same reason signatures.yaml and checkpoints.yaml are: this
          file is a declared input of p0t7_assemble_h5ad, so editing it rebuilds
          the .h5ad and re-runs Phases 1–3. Re-pinning a database must not cost
          that.
      adjacencies:
        type: object
        description: >
          The compartment pairs Phase 4 correlates across, keyed on aoi_code and
          never on compartment — `compartment` is degenerate across sites (L, LB
          and mLN are all `tumour`), so keying on it would pool lung and brain.
          TBME is deliberately absent despite being the glial side of a brain
          adjacency: 20 of 20 of its AOIs sit in one DSP run, so batch is
          inseparable from biology there (ADR 0009 §3, ADR 0014 §3). Re-scoping
          this list is a stop-and-ask.
        minProperties: 2
        additionalProperties:
          type: object
          required: [tumour, immune]
          additionalProperties: false
          properties:
            tumour: {type: string}
            immune: {type: string}
      pairing:
        type: object
        required: [duplicate_rule, duplicate_sensitivity, expected_n_patients]
        additionalProperties: false
        properties:
          duplicate_rule:
            type: string
            enum: [mean_log2, highest_detection_rate]
            description: >
              How a patient's duplicate AOIs on one side of an adjacency are
              collapsed. ADR 0021 §1 pre-registers mean_log2 as the primary,
              because the alternative needs a tiebreak rule that does not exist
              in this project and inventing one after seeing the correlations is
              the ADR 0016 §3 failure. Affects P12 and P24 only — 2 of 13 lung
              patients, 0 of 8 brain — so it cannot be load-bearing. This is
              flag-don't-drop applied to a collapse: no AOI is discarded.
          duplicate_sensitivity:
            type: string
            enum: [mean_log2, highest_detection_rate]
            description: >
              The rejected collapse rule, run in full and reported beside the
              primary with a delta column. ADR 0012's shape, applied to a third
              choice.
          expected_n_patients:
            type: object
            required: [lung, brain]
            additionalProperties: false
            description: >
              Asserted by p4t1_build_pairs against design_matrix.tsv, not
              discovered. If either count moves, the design changed and the
              phase stops rather than adapting to it. brain = 8 is the binding
              constraint on the whole project and every brain claim states it
              inline (hard constraint 8).
            properties:
              lung: {type: integer, minimum: 2}
              brain: {type: integer, minimum: 2}
      detection:
        type: object
        required: [detected_in_aoi_fraction]
        additionalProperties: false
        properties:
          detected_in_aoi_fraction:
            type: number
            exclusiveMinimum: 0
            maximum: 1
            description: >
              Fraction of a compartment's AOIs in which a gene must clear
              qc.detection_background_multiple × that AOI's NegProbe-WTX level
              (ADR 0007) to count as present there. Identical to
              contexture.scoring's and checkpoints.detection's value by design:
              Phase 4 introduces no threshold the project did not already
              operate under, so its coverage numbers compare directly with the
              earlier phases'. A pair enters only if BOTH members clear it, each
              in the compartment that member is measured in, evaluated per
              direction — CellChatDB is directed. ADR 0021 §3.
      correlation:
        type: object
        required: [method, min_n_patients]
        additionalProperties: false
        properties:
          method:
            type: string
            enum: [spearman]
            description: >
              Spearman, never Pearson: at n = 13 and n = 8 Pearson is a coin
              flip on one outlier (PROJECT_PLAN §6, P4-T3). The enum is the
              mechanism — a config edit cannot quietly switch it.
          min_n_patients:
            type: integer
            minimum: 3
            description: >
              Binds the DETECTED-BOTH SENSITIVITY ONLY. The primary keeps every
              paired patient at fixed n with n_detected_both as a column,
              because dropping on detection is expression-dependent selection —
              it removes the low values of both members preferentially, which
              induces correlation rather than removing it — and because a
              varying n would force the permutation null to be recalibrated at
              every distinct n. ADR 0021 §5.
      null_calibration:
        type: object
        required: [n_permutations, n_matched_draws, n_expression_deciles, fdr_alpha]
        additionalProperties: false
        properties:
          n_permutations:
            type: integer
            minimum: 1000
            description: >
              NULL A, the one Gate 4 turns on: permute THE PAIRING, not the
              expression — patient labels on the immune side, within site, so
              the null preserves both n's. Seeded from config.seed and passed
              explicitly; no implicit RNG. p1t3_variance_partition is the
              in-repo precedent.
          n_matched_draws:
            type: integer
            minimum: 1000
            description: >
              NULL B, the abundance-matched control (ADR 0021 §6): random gene
              pairs from the same mean-expression decile as the real ligand and
              receptor, true pairing intact. It asks whether a nomination beats
              "high-expression genes correlate with high-expression genes",
              which is the likeliest way this phase produces a wrong answer
              given that the surviving ligand class is the broadly-expressed
              membrane and matrix one. It qualifies a nomination; it is not a
              second gate and adds no second FDR family.
          n_expression_deciles: {type: integer, minimum: 2}
          fdr_alpha: {type: number, exclusiveMinimum: 0, maximum: 1}
  survival:
    type: object
    description: >
      Phase 5 / prognostic association. PRE-REGISTERED in ADR 0024 and committed
      before any Phase 5 result was computed.

      Phase 5's central quantity is a median-split Kaplan-Meier at n = 13 (lung)
      and n = 8 (brain). That is the easiest quantity in this project to
      manufacture after the fact — the split point, the endpoint, the censoring
      convention and the covariate set are each a degree of freedom, and each can
      be chosen to make a curve separate. Every one of them is fixed here.

      Every key P5-T1..T5 needs is present, including P5-T4's, because
      config.yaml is a declared input of the .h5ad build and its SHA-256 is
      recorded in `uns`: opening this block rebuilds Phases 1-4 once, and a
      second edit would cost that again.
    required:
      [clinical_yaml, tcga_yaml, aoi_codes, aggregation, model, multiplicity]
    additionalProperties: false
    properties:

      clinical_yaml:
        type: string
        minLength: 1
        description: >
          Path to the clinical manifest (P5-T1), validated against
          clinical.schema.yaml at load. The PIN lives there, not here, so
          re-pinning never rebuilds the .h5ad — the rule ligand_receptor.yaml
          follows (ADR 0021 §2) and external_validation.yaml follows one step
          further.
      tcga_yaml:
        type: string
        minLength: 1
        description: >
          Path to the TCGA LUAD manifest (P5-T4). Named NOW, in the same single
          edit, so the external-cohort task costs no second Phases 1-4 rebuild.
          The file is created when P5-T4 fetches and pins the cohort; until then
          common.smk's exists() guard leaves it absent and the workflow parses
          clean, exactly as it does for a checkout that has not fetched the
          supplementary files.

      aoi_codes:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
        description: >
          The AOIs Phase 5 draws scores from — TIME-L and TIME-B, the same 23
          that Phase 2 scored. NOT extended to L/LB to reach the plan's "~35
          patients": that is a stop-and-ask scope change, and it would re-open
          the detection floor in compartments where the panel clears far less
          (P3-T2: L 2/9 genes, LB 3/9, against TIME-L 8/9). A larger n bought
          with a less measurable compartment is not a larger n. ADR 0024 §2.

      aggregation:
        type: object
        required: [method, scoring_method]
        additionalProperties: false
        description: >
          P5-T2. How per-AOI signature scores become one value per patient per
          site. PROJECT_PLAN §6 requires the rule be specified; this is it.
        properties:
          method:
            type: string
            enum: [mean, median]
            description: >
              Only two patients contribute duplicate TIME AOIs (P12 and P24,
              both TIME-L), so this moves 2 of 13 lung patients and 0 of 8 brain
              ones and cannot be load-bearing. `mean` matches ADR 0021 §1's
              duplicate_rule, so Phase 5 collapses duplicates the way Phase 4
              already does rather than inventing a second convention.
          scoring_method:
            type: string
            description: >
              Which of contexture.scoring.methods to carry forward. Phase 2 ran
              ssgsea and zscore and treated their AGREEMENT as the robustness
              evidence, neither being the other's tiebreaker; Phase 5 must name
              one as primary rather than silently pooling them, and the other is
              a declared sensitivity (ADR 0012's shape).

      model:
        type: object
        required:
          [split, endpoint_by_site, censoring_token, test, alpha, min_arm_size]
        additionalProperties: false
        description: >
          P5-T3. The stratification and the test, fixed before any curve.
        properties:
          split:
            type: string
            enum: [median]
            description: >
              Median only. Not a tertile, not an optimal cutpoint, not a
              maximally-selected rank statistic — those are the standard routes
              to a separation that does not replicate, and at 12 and 7 events
              they are not defensible. Computed WITHIN the arm being split, so
              arms are as balanced as an odd n allows (6/7 lung, 4/4 brain).
              An enum of one is deliberate: widening it must be an edit a
              reviewer can see, not a value someone passes.
          endpoint_by_site:
            type: object
            required: [lung, brain]
            additionalProperties: false
            description: >
              Which time-to-event column belongs to which arm. Duplicated from
              clinical.yaml's columns.endpoints ON PURPOSE — the manifest says
              what the file contains, this says what the analysis uses, and the
              rule asserts they agree. A silent divergence between the two would
              be an endpoint swap nobody could see.
            properties:
              lung: {type: string, minLength: 1}
              brain: {type: string, minLength: 1}
          censoring_token:
            type: string
            minLength: 1
            description: >
              The lung column's literal "still alive" value. The BRAIN column
              spells censoring differently — an empty cell — and that asymmetry
              is measured rather than assumed: the lung `Alive` set and the brain
              blank set are identical (patients 6, 11, 35), which is what
              licenses reading a blank as censored rather than missing. Asserted
              by the rule; if the sets ever differ the phase stops.
          test:
            type: string
            enum: [logrank]
            description: >
              Log-rank, reported with the hazard ratio and its confidence
              interval beside it — CLAUDE.md hard constraint 7 forbids a p-value
              without n, effect size and a CI, and a bare log-rank p is exactly
              that.
          alpha:
            type: number
            exclusiveMinimum: 0
            maximum: 1
          min_arm_size:
            type: integer
            minimum: 1
            description: >
              Floor below which an arm is reported as not assessable rather than
              tested. At 4 per arm in brain this is close to binding, and that is
              the point: it makes the limit explicit rather than letting a
              two-patient arm produce a number.

      multiplicity:
        type: object
        required: [n_signatures, n_cohorts, method, alpha]
        additionalProperties: false
        description: >
          P5-T5. Declared BEFORE the first p-value. PROJECT_PLAN §6 says "you
          tested 5 signatures x 2 cohorts — say so, with correction"; the
          repository resolves SIX signatures, and the repository is what will be
          tested.
        properties:
          n_signatures:
            type: integer
            minimum: 1
            description: >
              Asserted against the resolved contents of signatures.yaml, not
              trusted — a set added or removed without updating this number must
              fail rather than quietly change the family size.
          n_cohorts:
            type: integer
            minimum: 1
            description: >
              This study and TCGA LUAD. ONE family, not two: "does the same
              signature stratify an independent cohort" is a single question
              asked twice, and correcting each cohort separately would understate
              the search.
          method:
            type: string
            description: The correction, named. fdr_bh everywhere else in this project.
          alpha:
            type: number
            exclusiveMinimum: 0
            maximum: 1
  fair:
    type: object
    description: >
      Phase 6 / FAIR packaging (P6-T2..T4). Paths to the two manifests, the OLS4
      service the ontology resolver queries, the identifiers the RO-Crate
      carries as PIDs, and the two licence URLs.

      The identifiers are DUPLICATED from `project:` deliberately, the way
      survival.model.endpoint_by_site is duplicated from clinical.yaml: the
      crate is the machine-readable claim about what this workflow analysed, and
      a divergence between it and the workflow's own configuration is the kind
      of error nobody reads a JSON-LD graph carefully enough to catch.
      common.smk asserts the two agree at parse time, so the duplication fails
      loudly instead of drifting.
    required: [ontology_yaml, ro_crate_yaml, ols, identifiers, licences]
    additionalProperties: false
    properties:
      ontology_yaml:
        type: string
        description: config/ontology_terms.yaml — the FAIR I2 mapping (§7.2).
      ro_crate_yaml:
        type: string
        description: >
          config/ro_crate.yaml — the manifest of described entities. Guarded by
          exists() in common.smk, so the workflow parses clean before it lands.
      ols:
        type: object
        required: [api, timeout_seconds, max_attempts, retry_wait_seconds]
        additionalProperties: false
        properties:
          api: {type: string, format: uri}
          timeout_seconds: {type: integer, minimum: 1}
          max_attempts:
            type: integer
            minimum: 1
            description: >
              Retries are for a flaky network, NOT for a term that does not
              resolve. There is no fallback path and no near-match acceptance.
          retry_wait_seconds: {type: integer, minimum: 0}
      identifiers:
        type: object
        required: [geo_accession, source_pmid, geo_url, pubmed_url, repository, doi]
        additionalProperties: false
        properties:
          geo_accession: {type: string, pattern: "^GSE[0-9]+$"}
          source_pmid: {type: string, pattern: "^[0-9]+$"}
          geo_url: {type: string, format: uri}
          pubmed_url: {type: string, format: uri}
          repository:
            type: string
            format: uri
            description: >
              The real remote, asserted against `git remote get-url origin` by
              p6t3_citation_audit. CITATION.cff and codemeta.json both carried a
              URL that 404s until P6-T3.
          doi:
            type: [string, "null"]
            description: >
              Minted by P6-T5, null until then. Null rather than a placeholder
              string: a DOI that does not resolve is worse than an absent one,
              and the crate builder emits the field only when it is populated.
      licences:
        type: object
        required: [code, data]
        additionalProperties: false
        properties:
          code: {type: string, format: uri}
          data: {type: string, format: uri}
  reference:
    type: object
    description: >
      P2-T5 reference matrices, fetched into paths.reference. Same ADR 0005
      contract as `acquire`: pinned digests, protected() outputs, resources/
      read-only afterwards.
    required: [base_url, artifacts]
    additionalProperties: false
    properties:
      base_url:
        type: string
        pattern: "/[0-9a-f]{40}$"
        description: >
          Must end in a 40-character commit SHA. CellProfileLibrary is a live
          GitHub repo, so a branch ref would let the reference matrix change
          under a rerun and turn the sha256 pins below into failures rather
          than controls.
      artifacts:
        type: object
        minProperties: 1
        additionalProperties:
          type: object
          required: [remote, dest, stability, sha256]
          additionalProperties: false
          properties:
            remote: {type: string}
            dest: {type: string}
            stability: {type: string, enum: [fixed, volatile]}
            sha256: {type: [string, "null"], pattern: "^[0-9a-f]{64}$"}
  acquire:
    type: object
    description: >
      P0-T2 source manifest. Every artifact is fetched from base_url/remote into
      paths.raw/dest. `stability` is the checksum tier and it is load-bearing:
      author-uploaded supplementary files are `fixed` and a SHA-256 mismatch is a
      hard failure, while GEO-generated metadata (SOFT, series matrix) is
      `volatile` — regenerated server-side, so its digest is recorded as an
      observation rather than enforced. See ADR 0005.
    required: [base_url, artifacts]
    additionalProperties: false
    properties:
      base_url: {type: string}
      artifacts:
        type: object
        minProperties: 1
        additionalProperties:
          type: object
          required: [remote, dest, stability, sha256]
          additionalProperties: false
          properties:
            remote: {type: string, description: path below base_url}
            dest: {type: string, description: filename under paths.raw}
            stability:
              type: string
              enum: [fixed, volatile]
            sha256:
              type: [string, "null"]
              pattern: "^[0-9a-f]{64}$"
              description: >
                null until the first run computes it. A `fixed` artifact left
                null is an unenforced provenance control that looks enforced —
                pin it before committing. Same reasoning as
                qc.min_gene_detection_rate.
