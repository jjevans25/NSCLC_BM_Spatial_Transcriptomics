name: py-analysis
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - anndata
  - scanpy
  - umap-learn
  - numpy
  - scipy
  - pandas
  - pyarrow
  - statsmodels
  - gseapy
  - scikit-survival
  - networkx
  - matplotlib
  - seaborn
  - pyyaml
  - jsonschema
  # anndata >=0.11 does a conditional `import xarray` in compat/. Snakemake
  # appends its own interpreter's site-packages to sys.path (so the job can
  # import the snakemake shim), which sits AFTER this env — so anything this
  # env lacks silently falls through to the user's base install. A base xarray
  # built against a different numpy then fails with a binary-incompatibility
  # error that looks nothing like the real cause. The env must be
  # self-sufficient for every transitive optional import, not just direct ones.
  - xarray
  # marimo: app-tier notebooks are exported headlessly by a rule (§4.5),
  # so marimo must be inside the analysis env, not just on the dev PATH.
  - marimo
  # rocrate (P6-T2): the RO-Crate 1.1 builder. It sat under a `pip:` section
  # until P6-T0, and that was a hermeticity hole of exactly the kind ADR 0023
  # exists to close: Snakemake installs from <env>.<platform>.pin.txt when one
  # is present and ignores this file entirely, and the pin is
  # `conda list --explicit` output, which records CONDA packages only. A pip
  # dependency is therefore invisible to the pin -- it worked here and would
  # have failed in the clean room. conda-forge carries it, so there is no
  # reason for this project to have a `pip:` section at all, and it no longer
  # does. See docs/decisions/0029-a-pin-must-carry-every-dependency.md
  - rocrate
