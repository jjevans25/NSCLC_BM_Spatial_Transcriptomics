# ---------------------------------------------------------------------------
# AOI code -> site + compartment (PROJECT_PLAN §A.2)
#
# Q2 IS RESOLVED (2026-08-24, docs/data-provenance.md): these are genuinely
# antibody-segmented compartments, not descriptively-named geometric ROIs.
# Collection was by UV-cleavage of PanCK+ and PanCK- segments separately, within
# ROIs placed by a pathologist on H&E + immunofluorescence. The `compartment`
# vocabulary stands and Aim A4 is not reframed.
#
# THE CAVEAT THAT SURVIVES, and that the `notes` below now state exactly:
# PanCK was the ONLY collection mask. CD45 and GFAP guided where a human placed
# the ROI; nothing was collected on a CD45 or GFAP mask. A TIME AOI is the
# PanCK-negative segment of an ROI sited in a CD45-rich region — not a
# CD45-sorted population. Do not write "CD45+ AOI" or treat a compartment label
# as a cell-type label; that is the same overclaim hard constraint 6 forbids for
# "colocalisation". P0-T6's marker sanity check is what evidences these labels.
#
# ontology_* fields are filled in during P0-T3/§7.2, not guessed here.
# ---------------------------------------------------------------------------

